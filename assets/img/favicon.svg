  </g>
  <!-- Monograma: legível a 16px porque é uma forma só, não duas letras. -->
  <path d="M9 7h7.6c3.3 0 5.4 1.8 5.4 4.6 0 1.9-1 3.3-2.6 4 2 .6 3.3 2.2 3.3 4.4 0 3-2.3 5-5.9 5H9V7zm3.4 3v4.2h3.8c1.4 0 2.2-.8 2.2-2.1 0-1.3-.8-2.1-2.2-2.1h-3.8zm0 7.1V22h4.2c1.5 0 2.4-.9 2.4-2.4s-.9-2.4-2.4-2.4h-4.2z"
