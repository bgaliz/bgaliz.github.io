<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <title>Bruno Galiz</title>
  <!-- Fundo tinta, sem raio: a mesma linguagem do site. -->
  <rect width="32" height="32" fill="#0B0A08"/>
  <!-- Retícula a 45°: papel milimetrado, a mesma ideia dos fios do site. -->
